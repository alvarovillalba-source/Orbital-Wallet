services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "4173"
    volumes:
      - orbital_data:/app/data
      - orbital_documents:/app/public/document-assets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ORBITAL_DOMAIN: ${ORBITAL_DOMAIN:?Set ORBITAL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  orbital_data:
  orbital_documents:
  caddy_data:
  caddy_config:
